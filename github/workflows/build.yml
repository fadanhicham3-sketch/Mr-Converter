name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          test -f index.html || { echo "index.html not found in repo root"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/mrimg/converter
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values
          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MRIMG"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mrimg.converter'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mrimg.converter'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MR IMG Converter</string>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/mrimg/converter/MainActivity.java <<'EOF'
          package com.mrimg.converter;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.ImageDecoder;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.nio.ByteBuffer;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.atomic.AtomicInteger;

          public class MainActivity extends Activity {
              private static final int REQ_FILES = 1;
              private WebView web;
              private ValueCallback<Uri[]> chooserCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF070D18);
                  getWindow().setNavigationBarColor(0xFF070D18);

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF070D18);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (chooserCallback != null) chooserCallback.onReceiveValue(null);
                          chooserCallback = cb;
                          Intent i;
                          try {
                              i = params.createIntent();
                          } catch (Exception e) {
                              i = new Intent(Intent.ACTION_GET_CONTENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType("*/*");
                          }
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(i, REQ_FILES);
                          } catch (Exception e) {
                              chooserCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILES && chooserCallback != null) {
                      Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      chooserCallback.onReceiveValue(result);
                      chooserCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              /** Methods called from the page's JavaScript as window.AndroidBridge.* */
              private class Bridge {
                  private final AtomicInteger counter = new AtomicInteger(0);
                  private final Map<String, OutputStream> outs = new ConcurrentHashMap<>();
                  private final Map<String, Uri> outUris = new ConcurrentHashMap<>();
                  private final Map<String, ByteArrayOutputStream> decIn = new ConcurrentHashMap<>();
                  private final Map<String, byte[]> decOut = new ConcurrentHashMap<>();

                  /* ---------- Save to Downloads/MR IMG Converter ---------- */
                  @JavascriptInterface
                  public String saveOpen(String name, String mime) {
                      try {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                          v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/MR IMG Converter");
                          v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                          Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (u == null) return null;
                          OutputStream o = getContentResolver().openOutputStream(u);
                          if (o == null) return null;
                          String id = String.valueOf(counter.incrementAndGet());
                          outs.put(id, o);
                          outUris.put(id, u);
                          return id;
                      } catch (Exception e) {
                          return null;
                      }
                  }

                  @JavascriptInterface
                  public boolean saveWrite(String id, String b64) {
                      try {
                          OutputStream o = outs.get(id);
                          if (o == null) return false;
                          o.write(Base64.decode(b64, Base64.DEFAULT));
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean saveClose(String id) {
                      try {
                          OutputStream o = outs.remove(id);
                          Uri u = outUris.remove(id);
                          if (o != null) o.close();
                          if (u != null) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.IS_PENDING, 0);
                              getContentResolver().update(u, v, null, null);
                          }
                          return o != null;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  /* ---------- Native image decoding (HEIC, RAW/DNG, etc.) ---------- */
                  @JavascriptInterface
                  public String decodeBegin() {
                      String id = "d" + counter.incrementAndGet();
                      decIn.put(id, new ByteArrayOutputStream());
                      return id;
                  }

                  @JavascriptInterface
                  public boolean decodePut(String id, String b64) {
                      try {
                          ByteArrayOutputStream b = decIn.get(id);
                          if (b == null) return false;
                          byte[] d = Base64.decode(b64, Base64.DEFAULT);
                          b.write(d, 0, d.length);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public int decodeFinish(String id) {
                      try {
                          ByteArrayOutputStream in = decIn.remove(id);
                          if (in == null) return -1;
                          byte[] bytes = in.toByteArray();
                          Bitmap bmp = null;
                          try {
                              ImageDecoder.Source src = ImageDecoder.createSource(ByteBuffer.wrap(bytes));
                              bmp = ImageDecoder.decodeBitmap(src, (decoder, info, source) ->
                                      decoder.setAllocator(ImageDecoder.ALLOCATOR_SOFTWARE));
                          } catch (Throwable t) {
                              bmp = null;
                          }
                          if (bmp == null) bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                          if (bmp == null) return -1;
                          ByteArrayOutputStream png = new ByteArrayOutputStream();
                          bmp.compress(Bitmap.CompressFormat.PNG, 100, png);
                          bmp.recycle();
                          byte[] out = png.toByteArray();
                          decOut.put(id, out);
                          return out.length;
                      } catch (Throwable t) {
                          return -1;
                      }
                  }

                  @JavascriptInterface
                  public String decodeRead(String id, int offset, int length) {
                      byte[] d = decOut.get(id);
                      if (d == null || offset < 0 || offset >= d.length) return "";
                      int end = Math.min(d.length, offset + length);
                      return Base64.encodeToString(d, offset, end - offset, Base64.NO_WRAP);
                  }

                  @JavascriptInterface
                  public void decodeRelease(String id) {
                      decIn.remove(id);
                      decOut.remove(id);
                  }
              }
          }
          EOF

      - name: Create app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw

          S = 1024
          if os.path.exists('icon.png'):
              icon = Image.open('icon.png').convert('RGBA').resize((S, S), Image.LANCZOS)
          else:
              c1, c2 = (0x5B, 0x9D, 0xFF), (0x7F, 0x4D, 0xFF)
              grad = Image.new('RGB', (S, S))
              px = grad.load()
              for y in range(S):
                  for x in range(S):
                      t = (x + y) / (2 * (S - 1))
                      px[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3))
              icon = grad.convert('RGBA')

              overlay = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(overlay)
              d.rounded_rectangle((228, 248, 796, 776), radius=85, fill=(255, 255, 255, 45))
              d.rounded_rectangle((228, 248, 796, 776), radius=85, outline=(255, 255, 255, 255), width=40)
              d.ellipse((348, 378, 452, 482), fill=(255, 255, 255, 255))
              d.polygon([(276, 718), (430, 560), (560, 690), (650, 590), (752, 708), (752, 740), (276, 740)],
                        fill=(255, 255, 255, 255))
              icon = Image.alpha_composite(icon, overlay)

              mask = Image.new('L', (S, S), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, S - 1, S - 1), radius=230, fill=255)
              icon.putalpha(mask)

          for folder, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              p = f'android/app/src/main/res/mipmap-{folder}'
              os.makedirs(p, exist_ok=True)
              icon.resize((size, size), Image.LANCZOS).save(f'{p}/ic_launcher.png')
          PY

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MR-IMG-Converter.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR-IMG-Converter
          path: MR-IMG-Converter.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MR IMG Converter build ${{ github.run_number }}
          files: MR-IMG-Converter.apk
